[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pocketbudget"
version = "0.1.0"
description = "A CLI budgeting application"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
pocketbudget = "pocketbudget.cli:main"

[tool.setuptools.packages.find]
include = ["pocketbudget*"]
